<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/style.css">
    <title>FoodStore-Client</title>
</head>
<body>
    <header class="header">
            <h1>!Fs</h1>
            <nav class="navegacion">
                <ul>
                    <li><a href="#" rel="noopener noreferrer">Inicio</a></li>
                    <li><a href="#" rel="noopener noreferrer">Mis Pedidos</a></li>
                    <li><a href="/src/pages/store/cart/cart.html" rel="noopener noreferrer">Carrito</a></li>

                    <li><button id="logoutButton">Cerrar sesión</button></li>
                </ul>
            </nav>      
    </header>
    <div class="contenedor_principal">
        <aside class="categorias">
        <h3>Categorías</h3>
        <ul id="lista-categorias"></ul>
        </aside>
        <main class="contenedor_secundario">
            <form class="busqueda_productos">
                <label for="producto"></label>
                <input type="text" name="producto" id="buscador" placeholder="Buscar Productos" required>
                <button  class="buscar_boton" type="submit">BUSCAR</button> 
            </form>
            <h2 id="prod_destacados">Listado de Productos</h2>
            <p id="mensaje-no-resultados" style="display: none;">No se encontraron productos</p>

            <section id="contenedor-productos"></section>
        
        </main>
    </div>
    <footer>
        <p class="p_footer">Food Store. Todos los derechos reservados</p>
        <p class="p_footer">Información de contacto: <a href="#">info@foodstore.com</a></p>

    </footer>   
    <script type="module" src="home.ts"></script>
